version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: shakuni-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      - MODEL_PATH=/app/ai_engine/models/shakuni_classifier.joblib
      - VECTORIZER_PATH=/app/ai_engine/models/shakuni_vectorizer.joblib
    volumes:
      - ./ai_engine/models:/app/ai_engine/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000/api
    container_name: shakuni-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
