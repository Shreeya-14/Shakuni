services:
  - type: web
    name: shakuni-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MODEL_PATH
        value: ai_engine/models/shakuni_classifier.joblib
      - key: VECTORIZER_PATH
        value: ai_engine/models/shakuni_vectorizer.joblib
